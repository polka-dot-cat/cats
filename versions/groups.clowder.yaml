name: cats-groups-test

protocol: https

defaults:
  branch: master
  remote: origin
  source: github

sources:
  github:
    url: github.com

clowder:
  - name: polka-dot-cat/mu
    branch: knead
    groups: [cats, notdefault]
  - name: polka-dot-cat/mu
    path: mu-cat
    branch: knead
    groups: [cats]
  - name: polka-dot-cat/duke
    path: duke
    branch: purr
    groups: [cats, notdefault]
  - name: polka-dot-cat/kit
    path: black-cats/kit
    groups: [black-cats]
  - name: polka-dot-cat/kishka
    path: black-cats/kishka
    groups: [black-cats]
  - name: polka-dot-cat/june
    path: black-cats/june
    groups: [black-cats]
  - name: polka-dot-cat/sasha
    path: black-cats/sasha
    groups: [black-cats]
