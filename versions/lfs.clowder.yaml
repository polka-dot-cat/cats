name: cats-lfs

protocol: https

defaults:
  source: github

sources:
  github:
    url: github.com

clowder:
  - name: polka-dot-cat/mu
    branch: lfs
    groups: [cats]
    git:
      lfs: true
  - name: polka-dot-cat/duke
    branch: purr
    groups: [cats]
  - name: polka-dot-cat/kit
    path: black-cats/kit
    groups: [black-cats]
  - name: polka-dot-cat/kishka
    path: black-cats/kishka
    groups: [black-cats]
  - name: polka-dot-cat/june
    path: black-cats/june
    groups: [black-cats]
  - name: polka-dot-cat/sasha
    path: black-cats/sasha
    groups: [black-cats]
